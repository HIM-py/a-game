<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انضم للعبة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <div style="display: flex; align-items: center; gap: 15px;">
      <img src="https://cdn-icons-png.flaticon.com/512/921/921071.png" alt="لاعب" style="width: 40px; filter: drop-shadow(0 0 10px #8b5cf6);">
      <div>
        <h1 style="margin: 0;">انضم للعبة</h1>
        <p style="margin: 0; color: #94a3b8; font-size: 0.9em;">صراع النشرات الأمنية</p>
      </div>
    </div>
    <a href="index.html" style="text-decoration: none; color: #0ea5e9; font-weight: bold; background: rgba(14, 165, 233, 0.1); padding: 10px 20px; border-radius: 20px; border: 1px solid #0ea5e9;">العودة للرئيسية</a>
  </header>

  <div id="joinBox" class="panel" style="max-width: 500px; text-align: center;">
    <img src="https://cdn-icons-png.flaticon.com/512/921/921071.png" alt="لاعب" style="width: 100px; margin-bottom: 20px; filter: drop-shadow(0 0 15px #8b5cf6);">
    <h2 style="color: #fff; margin-bottom: 10px;">انضم للعبة</h2>
    <p style="color: #94a3b8; margin-bottom: 30px;">أدخل بيانات الدخول للانضمام إلى اللعبة</p>
    
    <div style="text-align: right;">
      <label>كود الغرفة</label>
      <input id="codeInput" class="input" maxlength="4" placeholder="مثال: AB12" style="text-transform:uppercase; text-align: center; letter-spacing: 5px; font-weight: bold; font-size: 1.2em;">
      
      <label>اسمك</label>
      <input id="nameInput" class="input" placeholder="مثال: أحمد">
    </div>
    
    <button id="joinBtn" class="btn" style="width: 100%; margin-top: 10px;">دخول</button>
    <p id="errMsg" class="err"></p>
    
    <div style="margin-top: 20px; padding: 15px; background: rgba(14, 165, 233, 0.1); border-radius: 10px; border: 1px solid rgba(14, 165, 233, 0.3); color: #cbd5e1; font-size: 0.9em;">
      يرجى الحصول على كود الغرفة من المشرف
    </div>
  </div>

  <div id="waitBox" class="panel hidden" style="text-align: center;">
    <h2 style="color: #0ea5e9; margin-bottom: 15px;">في الانتظار...</h2>
    <p style="font-size: 1.2em; margin-bottom: 10px;">أهلاً <strong id="myName" style="color: #fff;"></strong></p>
    <p id="teamInfo" style="color: #94a3b8;"></p>
  </div>

  <div id="playBox" class="panel hidden" style="max-width: 900px;">
    <div style="text-align: center; margin-bottom: 25px; font-weight: bold; color: #10b981; font-size: 1.3em; background: rgba(16, 185, 129, 0.1); padding: 10px; border-radius: 10px; border: 1px solid rgba(16, 185, 129, 0.3);">
      نقاط هذه الجولة: <span id="roundPoints">-</span>
    </div>
    
    <div id="cardsView" class="cards"></div>
    <div id="reasonView" class="hidden">
      <h3 style="color: #fff; margin-bottom: 15px;">لماذا اخترت هذه البطاقة؟</h3>
      <div id="reasonOptions" class="reason-options"></div>
    </div>
    <div id="statusMsg" class="status"></div>
    <div id="revealBox" class="reveal hidden"></div>
  </div>

  <div id="endBox" class="panel hidden" style="text-align: center;">
    <h2 style="color: #0ea5e9; margin-bottom: 20px;">انتهت اللعبة</h2>
    <div id="endContent"></div>
  </div>

  <div style="text-align: center; margin-top: 40px; color: #475569; font-size: 0.9em; padding-bottom: 20px;">
    <p>صراع النشرات الأمنية - تصميم <strong style="color: #64748b;">محمد العقيلي HIM.PY</strong> &copy; 2026</p>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myPick = null;
let myPlayerId = null;

document.getElementById('joinBtn').onclick = () => {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const name = document.getElementById('nameInput').value.trim();
  if (!code || !name) { document.getElementById('errMsg').textContent = 'أدخل الكود والاسم'; return; }
  
  socket.emit('joinRoom', { code, name }, (res) => {
    if (res.error) { document.getElementById('errMsg').textContent = res.error; return; }
    myPlayerId = res.playerId;
    document.getElementById('joinBox').classList.add('hidden');
    document.getElementById('waitBox').classList.remove('hidden');
    document.getElementById('myName').textContent = res.name;
    document.getElementById('teamInfo').textContent = 'في انتظار المشرف...';
  });
};

socket.on('youAreInTeam', ({ teamName }) => {
  document.getElementById('teamInfo').innerHTML = `فريقك: <strong>${teamName}</strong>`;
});

socket.on('roundStarted', ({ round, total, data }) => {
  myPick = null;
  document.getElementById('waitBox').classList.add('hidden');
  document.getElementById('playBox').classList.remove('hidden');
  document.getElementById('reasonView').classList.add('hidden');
  document.getElementById('revealBox').classList.add('hidden');
  document.getElementById('statusMsg').textContent = `الجولة ${round} / ${total} — اختر البطاقة`;
  document.getElementById('roundPoints').textContent = data.points + " نقاط";
  renderCards(data);
});

function renderCards(data) {
  const c = document.getElementById('cardsView');
  c.innerHTML = '';
  ['A','B'].forEach(k => {
    const d = data[k];
    const div = document.createElement('div');
    div.className = 'card';
    div.id = 'pick' + k;
    div.onclick = () => pickCard(k);
    div.innerHTML = `
      <div class="card-title">البطاقة ${k}</div>
      <div class="card-field"><span>المنتج</span><b>${d.product}</b></div>
      <div class="card-field"><span>الشدة</span><b class="severity">${d.severity}</b></div>
      <div class="card-field"><span>الحالة</span><b>${d.condition}</b></div>
      <div class="card-field"><span>الأثر</span><b>${d.impact}</b></div>
      <div class="context-box">${d.context}</div>`;
    c.appendChild(div);
  });
}

function pickCard(k) {
  if (myPick) return;
  myPick = k;
  document.getElementById('pickA').classList.toggle('picked', k === 'A');
  document.getElementById('pickB').classList.toggle('picked', k === 'B');
  socket.emit('pickCard', { card: k });
  document.getElementById('statusMsg').textContent = 'جاري التحقق...';
}

socket.on('showReasons', ({ reasons }) => {
  document.getElementById('reasonView').classList.remove('hidden');
  document.getElementById('statusMsg').textContent = 'اختر السبب';
  const box = document.getElementById('reasonOptions');
  box.innerHTML = '';
  reasons.forEach((r, i) => {
    const b = document.createElement('button');
    b.className = 'reason-option';
    b.textContent = r.text;
    b.onclick = () => {
      document.querySelectorAll('.reason-option').forEach(x => x.disabled = true);
      b.classList.add('selected');
      socket.emit('pickReason', { idx: i });
      document.getElementById('reasonView').classList.add('hidden');
      document.getElementById('statusMsg').textContent = 'تم اختيار السبب — في انتظار المشرف...';
    };
    box.appendChild(b);
  });
});

socket.on('wrongAnswer', ({ correct, explain }) => {
  document.getElementById('reasonView').classList.add('hidden');
  document.getElementById('statusMsg').textContent = 'إجابة خاطئة!';
  
  const box = document.getElementById('revealBox');
  box.classList.remove('hidden');
  box.style.display = 'block';
  box.innerHTML = `
    <h3 style="color: #ef4444; text-align:center;">إجابة خاطئة!</h3>
    <p style="text-align:center;">الإجابة الصحيحة كانت: <strong style="color:#10b981;">البطاقة ${correct}</strong></p>
    <p class="explain" style="text-align:center; margin-top:10px;">${explain}</p>
    <p style="text-align:center; color:#94a3b8; font-style:italic; margin-top:15px;">في انتظار المشرف للجولة التالية...</p>
  `;
});

socket.on('prepareNextRound', () => {
  const box = document.getElementById('revealBox');
  box.classList.add('hidden');
  box.style.display = 'none'; 
  document.getElementById('statusMsg').textContent = 'جاري تجهيز الجولة القادمة...';
});

socket.on('revealSoloPlayer', ({ correct, explain, mine, points }) => {
  document.getElementById('statusMsg').textContent = '';
  const box = document.getElementById('revealBox');
  box.classList.remove('hidden');
  box.style.display = 'block'; 
  box.innerHTML = `<h3 style="color:#10b981; text-align:center;">الإجابة: ${correct} (${points} نقاط)</h3><p class="explain" style="text-align:center; margin-bottom:15px;">${explain}</p><div class="res-team ${mine.cardOk && mine.reasonOk ? 'perfect' : mine.cardOk ? 'partial' : 'wrong'}"><h4>نتيجتك</h4><p>${mine.cardOk?'البطاقة صحيحة':'البطاقة خاطئة'} | ${mine.reasonOk?'السبب صحيح':'السبب خاطئ'}</p><p class="pts">+${mine.pts}</p></div>`;
});

socket.on('revealTeamPlayer', ({ correct, explain, mine, points }) => {
  document.getElementById('statusMsg').textContent = '';
  const box = document.getElementById('revealBox');
  box.classList.remove('hidden');
  box.style.display = 'block'; 
  box.innerHTML = `<h3 style="color:#10b981; text-align:center;">الإجابة: ${correct} (${points} نقاط)</h3><p class="explain" style="text-align:center; margin-bottom:15px;">${explain}</p><div class="res-team ${mine.pts > (points/2) ? 'perfect' : mine.pts > 0 ? 'partial' : 'wrong'}"><h4>نتيجة فريقك</h4><p>نسبة البطاقة: ${mine.cardRatio}% | نسبة السبب: ${mine.reasonRatio}%</p><p class="pts">+${mine.pts} (المجموع: ${mine.total})</p></div>`;
});

socket.on('gameEnded', ({ mode, finalScores }) => {
  document.getElementById('playBox').classList.add('hidden');
  document.getElementById('endBox').classList.remove('hidden');
  if (mode === 'solo') {
    document.getElementById('endContent').innerHTML = `<h2>نتيجتك: ${finalScores[myPlayerId] || 0} نقطة</h2>`;
  } else {
    document.getElementById('endContent').innerHTML = `<h2>انتهت اللعبة — راجع شاشة المشرف للنتائج</h2>`;
  }
});
</script>
</body>
</html>
