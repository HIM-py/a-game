<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">لوحة المشرف</title>
<link rel="stylesheet" href="style.css">
<style>
  /* تنسيقات منصة التتويج */
  .podium-container { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin: 40px 0; height: 250px; }
  .podium-step { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 120px; background: linear-gradient(180deg, rgba(13,27,56,0.9), rgba(6,11,25,0.95)); border: 2px solid; border-radius: 10px 10px 0 0; padding: 15px; }
  .podium-step.first { height: 220px; border-color: #fbbf24; box-shadow: 0 0 20px rgba(251,191,36,0.4); }
  .podium-step.second { height: 170px; border-color: #94a3b8; box-shadow: 0 0 15px rgba(148,163,184,0.3); }
  .podium-step.third { height: 130px; border-color: #b45309; box-shadow: 0 0 15px rgba(180,83,9,0.3); }
  .podium-name { font-weight: bold; color: #fff; margin-bottom: 5px; text-align: center; font-size: 1.1em; }
  .podium-score { color: #10b981; font-size: 1.2em; font-weight: bold; }
  .podium-rank { font-size: 2em; font-weight: bold; margin-bottom: 10px; }
  .podium-step.first .podium-rank { color: #fbbf24; }
  .podium-step.second .podium-rank { color: #94a3b8; }
  .podium-step.third .podium-rank { color: #b45309; }
  
  .full-leaderboard { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 15px; margin-top: 20px; max-width: 600px; margin-left: auto; margin-right: auto; }
  .lb-item { display: flex; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; }
  .lb-item:last-child { border-bottom: none; }
  .lb-item .rank { color: #0ea5e9; font-weight: bold; width: 30px; }
  .lb-item .name { flex: 1; text-align: right; margin-right: 15px; }
  .lb-item .score { color: #10b981; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div style="display: flex; align-items: center; gap: 15px;">
      <img src="/img/host.png" alt="مشرف" style="width: 50px; height: 50px; object-fit: cover; border-radius: 50%; border: 2px solid #0ea5e9; box-shadow: 0 0 10px rgba(14, 165, 233, 0.7); background-color: #060b19;">
      <div>
        <h1 style="margin: 0;" data-i18n="hostPanel">لوحة المشرف</h1>
        <p style="margin: 0; color: #94a3b8; font-size: 0.9em;" data-i18n="gameTitle">صراع النشرات الأمنية</p>
      </div>
    </div>
    <a href="index.html" style="text-decoration: none; color: #0ea5e9; font-weight: bold; background: rgba(14, 165, 233, 0.1); padding: 10px 20px; border-radius: 20px; border: 1px solid #0ea5e9;" data-i18n="backHome">العودة للرئيسية</a>
  </header>

  <div id="setup" class="panel" style="text-align: center;">
    <h2 style="margin-bottom: 30px; color: #fff; font-size: 1.8em;" data-i18n="chooseMode">اختر نمط اللعب</h2>
    <div class="mode-pick">
      <button class="mode-btn" data-mode="team">
        <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 15px; filter: drop-shadow(0 0 10px #0ea5e9);">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span data-i18n="teamMode">جماعي</span>
        <span style="font-size: 0.8em; font-weight: normal; color: #94a3b8;" data-i18n="teamModeDesc">لعب مع فريق من اللاعبين</span>
      </button>
      
      <button class="mode-btn" data-mode="solo">
        <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 15px; filter: drop-shadow(0 0 10px #8b5cf6);">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span data-i18n="soloMode">فردي</span>
        <span style="font-size: 0.8em; font-weight: normal; color: #94a3b8;" data-i18n="soloModeDesc">لعب بمفردك</span>
      </button>
    </div>
    <button id="createBtn" class="btn" disabled style="width: 100%; max-width: 400px;" data-i18n="createRoom">+ إنشاء غرفة</button>
  </div>

  <div id="lobby" class="panel hidden">
    <div class="room-code-box">
      <p data-i18n="roomCode">كود الغرفة</p>
      <div id="roomCode" class="code">----</div>
      <p class="hint" id="modeHint" style="margin-top: 10px;"></p>
    </div>
    <div id="playersList" class="players-list" style="text-align: center;"><h4 data-i18n="players">اللاعبون</h4></div>
    <div id="teamsView" class="teams-view hidden"></div>
    
    <div class="actions" style="text-align: center; margin-top: 30px;">
      <div id="distOptions" class="hidden" style="margin-bottom: 20px;">
        <button id="randomBtn" class="btn" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9);" data-i18n="randomDist">توزيع عشوائي (فريقين)</button>
      </div>
      <button id="startBtn" class="btn next-btn hidden" style="width: 100%; max-width: 400px;" data-i18n="startGame">ابدأ اللعبة</button>
    </div>
  </div>

  <div id="gameArea" class="panel hidden">
    <div class="scoreboard" id="scoreboard" style="margin-bottom: 20px; display: flex; justify-content: center; gap: 20px;"></div>
    
    <div style="text-align: center; margin-bottom: 15px; font-size: 1.5em; font-weight: bold; color: #ef4444;" id="timerDisplay">00:35</div>
    
    <div id="hostAnswerBox" style="display:none; background:rgba(139,92,246,0.15); border:2px solid #8b5cf6; padding:20px; border-radius:15px; margin-bottom:20px; color:#e2e8f0; font-size:1.05em; text-align:right; box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);"></div>

    <div id="cardsView" class="cards"></div>
    <div id="statusMsg" class="status"></div>
    <div id="revealBox" class="reveal hidden"></div>
    
    <div style="text-align: center; margin-top: 30px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
      <button id="forceEndBtn" class="btn hidden" style="background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);" data-i18n="forceEnd">إنهاء الجولة الآن</button>
      <button id="nextBtn" class="btn next-btn hidden" data-i18n="nextRound">الجولة التالية</button>
    </div>
  </div>

  <!-- ✅ شاشة النهاية (المنصة) -->
  <div id="endScreen" class="panel hidden" style="text-align: center; padding: 40px 20px;">
    <h2 style="color: #0ea5e9; font-size: 2.5em; margin-bottom: 10px;" data-i18n="gameOverTitle">🏆 انتهت اللعبة! 🏆</h2>
    <p style="color: #94a3b8; margin-bottom: 30px;" data-i18n="gameOverDesc">إليكم منصة التتويج والترتيب النهائي</p>
    
    <!-- منصة التتويج (أعلى 3) -->
    <div class="podium-container" id="podiumContainer"></div>

    <!-- الترتيب الكامل -->
    <div class="full-leaderboard" id="fullLeaderboard"></div>

    <button class="btn" onclick="location.reload()" style="margin-top: 30px;" data-i18n="newGame">لعبة جديدة</button>
  </div>

  <div style="text-align: center; margin-top: 40px; color: #475569; font-size: 0.9em; padding-bottom: 20px;">
    <p data-i18n="copyright">صراع النشرات الأمنية - تصميم محمد العقيلي HIM.PY &copy; 2026</p>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const translations = {
  ar: {
    hostPanel: "لوحة المشرف", gameTitle: "صراع النشرات الأمنية", backHome: "العودة للرئيسية",
    chooseMode: "اختر نمط اللعب", teamMode: "جماعي", teamModeDesc: "لعب مع فريق من اللاعبين",
    soloMode: "فردي", soloModeDesc: "لعب بمفردك", createRoom: "+ إنشاء غرفة",
    roomCode: "كود الغرفة", players: "اللاعبون", randomDist: "توزيع عشوائي (فريقين)",
    startGame: "ابدأ اللعبة", forceEnd: "إنهاء الجولة الآن", nextRound: "الجولة التالية",
    copyright: "صراع النشرات الأمنية - تصميم محمد العقيلي HIM.PY © 2026",
    gameOverTitle: "🏆 انتهت اللعبة! 🏆", gameOverDesc: "إليكم منصة التتويج والترتيب النهائي",
    newGame: "لعبة جديدة"
  },
  en: {
    hostPanel: "Host Panel", gameTitle: "Cyber Security Duel", backHome: "Back to Home",
    chooseMode: "Choose Game Mode", teamMode: "Team", teamModeDesc: "Play with a team of players",
    soloMode: "Solo", soloModeDesc: "Play by yourself", createRoom: "+ Create Room",
    roomCode: "Room Code", players: "Players", randomDist: "Random Distribution (2 Teams)",
    startGame: "Start Game", forceEnd: "End Round Now", nextRound: "Next Round",
    copyright: "Cyber Security Duel - Designed by Mohammed Al-Oqaili HIM.PY © 2026",
    gameOverTitle: "🏆 Game Over! 🏆", gameOverDesc: "Here is the podium and final leaderboard",
    newGame: "New Game"
  }
};

function applyLanguage(lang) {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[lang][key]) el.innerHTML = translations[lang][key];
  });
}

window.onload = () => {
  const savedLang = localStorage.getItem('lang') || 'ar';
  applyLanguage(savedLang);
};

const socket = io();
let currentMode = null;
let timerInterval = null;
let timeLeft = 35;

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timeLeft = 35;
  document.getElementById('timerDisplay').textContent = `00:${timeLeft < 10 ? '0'+timeLeft : timeLeft}`;
  document.getElementById('timerDisplay').style.display = 'block';
  timerInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      document.getElementById('timerDisplay').textContent = '00:00';
    } else {
      document.getElementById('timerDisplay').textContent = `00:${timeLeft < 10 ? '0'+timeLeft : timeLeft}`;
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById('timerDisplay').style.display = 'none';
}

document.querySelectorAll('.mode-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected');
    currentMode = b.dataset.mode;
    document.getElementById('createBtn').disabled = false;
  };
});

document.getElementById('createBtn').onclick = () => {
  socket.emit('createRoom', { mode: currentMode }, ({ code, mode }) => {
    const lang = localStorage.getItem('lang') || 'ar';
    document.getElementById('roomCode').textContent = code;
    document.getElementById('modeHint').textContent = mode === 'solo' ? translations[lang].soloMode : translations[lang].teamMode;
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('lobby').classList.remove('hidden');
  });
};

socket.on('roomUpdate', (room) => {
  const lang = localStorage.getItem('lang') || 'ar';
  document.getElementById('playersList').innerHTML = `<h4>${translations[lang].players} (${room.players.length}):</h4>` + room.players.map(p => `<span class="player-chip">${p.name}</span>`).join('');
  if (room.mode === 'solo') {
    document.getElementById('distOptions').classList.add('hidden');
    document.getElementById('teamsView').classList.add('hidden');
    document.getElementById('startBtn').classList.remove('hidden');
    document.getElementById('startBtn').disabled = room.players.length === 0;
  } else {
    if (!room.distributed) {
      document.getElementById('distOptions').classList.remove('hidden');
      document.getElementById('randomBtn').disabled = room.players.length < 2;
      document.getElementById('startBtn').classList.add('hidden');
    }
  }
});

socket.on('distributed', (room) => {
  document.getElementById('distOptions').classList.add('hidden');
  document.getElementById('teamsView').classList.remove('hidden');
  document.getElementById('teamsView').innerHTML = '<h4 style="width:100%; text-align:center; margin-bottom:15px; color:#fff;">---</h4>' + room.teams.map(t => `
    <div class="team-card"><h5>${t.name} (${t.members.length})</h5><p>${t.members.join(' · ')}</p></div>`).join('');
  document.getElementById('startBtn').classList.remove('hidden');
  document.getElementById('startBtn').disabled = false;
});

document.getElementById('randomBtn').onclick = () => socket.emit('distributeRandom');
document.getElementById('startBtn').onclick = () => socket.emit('startRound');

socket.on('roundStartedHost', ({ round, total, data }) => {
  const lang = localStorage.getItem('lang') || 'ar';
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('gameArea').classList.remove('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('forceEndBtn').classList.remove('hidden'); 
  document.getElementById('revealBox').classList.add('hidden');
  
  const box = document.getElementById('hostAnswerBox');
  box.style.display = 'block'; 
  box.innerHTML = `
    <strong style="color:#a78bfa; font-size:1.1em;">---</strong><br><br>
    <strong>${lang === 'ar' ? 'الإجابة الصحيحة' : 'Correct Answer'}:</strong> ${lang === 'ar' ? 'البطاقة' : 'Card'} ${data.correct} <br>
    <strong>${lang === 'ar' ? 'السبب' : 'Reason'}:</strong> ${lang === 'ar' ? data.reasons_ar.find(r => r.correct)?.text : data.reasons_en.find(r => r.correct)?.text} <br>
    <strong>${lang === 'ar' ? 'الشرح' : 'Explanation'}:</strong> ${lang === 'ar' ? data.explain_ar : data.explain_en} <br>
    <strong style="color:#10b981;">(${lang === 'ar' ? 'قيمة الجولة' : 'Round Points'}: ${data.points})</strong>
  `;
  document.getElementById('statusMsg').textContent = `${lang === 'ar' ? 'الجولة' : 'Round'} ${round} / ${total} — ${lang === 'ar' ? 'في انتظار اللاعبين...' : 'Waiting for players...'}`;
  renderCards(data, lang);
  startTimer(); 
});

function renderCards(data, lang) {
  const c = document.getElementById('cardsView');
  c.innerHTML = '';
  ['A','B'].forEach(k => {
    const d = data[k];
    c.innerHTML += `
      <div class="card">
        <div class="card-title">${lang === 'ar' ? 'البطاقة' : 'Card'} ${k}</div>
        <div class="card-field"><span>${lang === 'ar' ? 'المنتج' : 'Product'}</span><b>${d.product}</b></div>
        <div class="card-field"><span>${lang === 'ar' ? 'الشدة' : 'Severity'}</span><b class="severity">${d.severity}</b></div>
        <div class="card-field"><span>${lang === 'ar' ? 'الحالة' : 'Condition'}</span><b>${d.condition}</b></div>
        <div class="card-field"><span>${lang === 'ar' ? 'الأثر' : 'Impact'}</span><b>${d.impact}</b></div>
        <div class="context-box">${d.context}</div>
      </div>`;
  });
}

socket.on('progressUpdate', ({ answeredNames, total }) => {
  const lang = localStorage.getItem('lang') || 'ar';
  document.getElementById('statusMsg').textContent = `${answeredNames.length} / ${total}: ${answeredNames.join(' - ')}`;
});
socket.on('phaseChange', () => {
  const lang = localStorage.getItem('lang') || 'ar';
  document.getElementById('statusMsg').textContent = lang === 'ar' ? 'في انتظار اختيار السبب...' : 'Waiting for reasons...';
});

socket.on('revealSolo', ({ correct, explain_ar, explain_en, leaderboard, points }) => {
  const lang = localStorage.getItem('lang') || 'ar';
  const explain = lang === 'ar' ? explain_ar : explain_en;
  
  stopTimer();
  document.getElementById('statusMsg').textContent = '';
  document.getElementById('hostAnswerBox').style.display = 'none'; 
  document.getElementById('forceEndBtn').classList.add('hidden'); 
  const box = document.getElementById('revealBox');
  box.classList.remove('hidden');
  box.innerHTML = `<h3 style="color:#10b981; text-align:center;">${lang === 'ar' ? 'الإجابة' : 'Answer'}: ${correct} (${points})</h3><p class="explain" style="text-align:center; margin-bottom:20px;">${explain}</p><div class="leaderboard">${leaderboard.map((p, i) => `<div class="lb-row ${i===0?'top':''}"><span class="rank">${i+1}</span><span class="name">${p.name}</span><span class="pts">${p.total}</span></div>`).join('')}</div>`;
  document.getElementById('nextBtn').classList.remove('hidden');
});

socket.on('revealTeam', ({ correct, explain_ar, explain_en, results, points }) => {
  const lang = localStorage.getItem('lang') || 'ar';
  const explain = lang === 'ar' ? explain_ar : explain_en;
  
  stopTimer();
  document.getElementById('statusMsg').textContent = '';
  document.getElementById('hostAnswerBox').style.display = 'none';
  document.getElementById('forceEndBtn').classList.add('hidden');
  const box = document.getElementById('revealBox');
  box.classList.remove('hidden');
  box.innerHTML = `<h3 style="color:#10b981; text-align:center;">${lang === 'ar' ? 'الإجابة' : 'Answer'}: ${correct} (${points})</h3><p class="explain" style="text-align:center; margin-bottom:20px;">${explain}</p><div class="results">${results.map(r => `
    <div class="res-team ${r.pts > (points/2) ? 'perfect' : r.pts > 0 ? 'partial' : 'wrong'}">
      <h4>${r.name}</h4>
      <p>${r.members.join(' · ')}</p>
      <p style="font-size:0.85em; color:#cbd5e1; margin-top:10px;">${lang === 'ar' ? 'البطاقة' : 'Card'}: ${r.cardRatio}% | ${lang === 'ar' ? 'السبب' : 'Reason'}: ${r.reasonRatio}%</p>
      <p class="pts">+${r.pts} (${lang === 'ar' ? 'المجموع' : 'Total'}: ${r.total})</p>
    </div>`).join('')}</div>`;
  document.getElementById('nextBtn').classList.remove('hidden');
});

document.getElementById('forceEndBtn').onclick = () => {
  const lang = localStorage.getItem('lang') || 'ar';
  if(confirm(lang === 'ar' ? 'هل أنت متأكد من إنهاء الجولة الآن؟' : 'Are you sure you want to end the round?')) {
    socket.emit('forceEnd');
  }
};
document.getElementById('nextBtn').onclick = () => socket.emit('nextRound');

socket.on('readyNext', () => {
  document.getElementById('revealBox').classList.add('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('forceEndBtn').classList.add('hidden');
  stopTimer();
});

// ✅ استقبال النتائج النهائية وبناء منصة التتويج
socket.on('gameEnded', ({ mode, leaderboard }) => {
  stopTimer();
  document.getElementById('gameArea').classList.add('hidden');
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('endScreen').classList.remove('hidden');

  const podium = document.getElementById('podiumContainer');
  const fullList = document.getElementById('fullLeaderboard');
  
  podium.innerHTML = '';
  fullList.innerHTML = '';

  // بناء المنصة لأعلى 3
  if (leaderboard.length > 0) {
    // المركز الثاني (يسار)
    if (leaderboard[1]) {
      podium.innerHTML += `
        <div class="podium-step second">
          <div class="podium-rank">2</div>
          <div class="podium-name">${leaderboard[1].name}</div>
          <div class="podium-score">${leaderboard[1].score}</div>
        </div>`;
    }
    // المركز الأول (وسط)
    if (leaderboard[0]) {
      podium.innerHTML += `
        <div class="podium-step first">
          <div class="podium-rank">1</div>
          <div class="podium-name">${leaderboard[0].name}</div>
          <div class="podium-score">${leaderboard[0].score}</div>
        </div>`;
    }
    // المركز الثالث (يمين)
    if (leaderboard[2]) {
      podium.innerHTML += `
        <div class="podium-step third">
          <div class="podium-rank">3</div>
          <div class="podium-name">${leaderboard[2].name}</div>
          <div class="podium-score">${leaderboard[2].score}</div>
        </div>`;
    }
  }

  // بناء القائمة الكاملة
  leaderboard.forEach((p, i) => {
    fullList.innerHTML += `
      <div class="lb-item">
        <span class="rank">${i+1}</span>
        <span class="name">${p.name}</span>
        <span class="score">${p.score}</span>
      </div>`;
  });
});
</script>
</body>
</html>
