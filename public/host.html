<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المعلم</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header><h1>🎓 لوحة المعلم</h1></header>

  <div id="setup" class="panel">
    <h3>اختر نمط اللعب:</h3>
    <div class="mode-pick">
      <button class="mode-btn" data-mode="solo">🧑 فردي</button>
      <button class="mode-btn" data-mode="team">👥 جماعي</button>
    </div>
    <button id="createBtn" class="btn" disabled>➕ إنشاء غرفة</button>
  </div>

  <div id="lobby" class="panel hidden">
    <div class="room-code-box">
      <p>كود الغرفة:</p>
      <div id="roomCode" class="code"></div>
      <p class="hint" id="modeHint"></p>
    </div>
    <div id="playersList" class="players-list"><h4>اللاعبون (0):</h4></div>
    <div id="teamsView" class="teams-view hidden"></div>
    <div class="actions">
      <div id="distOptions" class="hidden">
        <button id="randomBtn" class="btn next-btn">🎲 توزيع عشوائي (فريقين)</button>
      </div>
      <button id="startBtn" class="btn next-btn hidden">▶️ ابدأ اللعبة</button>
    </div>
  </div>

  <div id="gameArea" class="panel hidden">
    <div class="scoreboard" id="scoreboard"></div>
    
    <!-- المربع البنفسجي -->
    <div id="hostAnswerBox" style="display:none; background:rgba(139,92,246,0.2); border:2px solid #a78bfa; padding:15px; border-radius:10px; margin-bottom:15px; color:#e9d5ff; font-size:1.05em; text-align:right;"></div>

    <div id="cardsView" class="cards"></div>
    <div id="statusMsg" class="status"></div>
    <div id="revealBox" class="reveal hidden"></div>
    
    <!-- أزرار التحكم -->
    <div style="text-align: center; margin-top: 20px;">
      <button id="forceEndBtn" class="btn hidden" style="background: linear-gradient(135deg, #ef4444, #dc2626); color: white; margin: 5px;">🛑 إنهاء الجولة الآن</button>
      <button id="nextBtn" class="btn next-btn hidden" style="margin: 5px;">الجولة التالية ➡️</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
console.log("🔥 شاشة المعلم (النسخة النهائية مع النقاط)");
const socket = io();
let currentMode = null;

document.querySelectorAll('.mode-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected');
    currentMode = b.dataset.mode;
    document.getElementById('createBtn').disabled = false;
  };
});

document.getElementById('createBtn').onclick = () => {
  socket.emit('createRoom', { mode: currentMode }, ({ code, mode }) => {
    document.getElementById('roomCode').textContent = code;
    document.getElementById('modeHint').textContent = mode === 'solo' ? '🧑 نمط فردي' : '👥 نمط جماعي';
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('lobby').classList.remove('hidden');
  });
};

socket.on('roomUpdate', (room) => {
  document.getElementById('playersList').innerHTML = `<h4>اللاعبون (${room.players.length}):</h4>` + room.players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');

  if (room.mode === 'solo') {
    document.getElementById('distOptions').classList.add('hidden');
    document.getElementById('teamsView').classList.add('hidden');
    document.getElementById('startBtn').classList.remove('hidden');
    document.getElementById('startBtn').disabled = room.players.length === 0;
  } else {
    if (!room.distributed) {
      document.getElementById('distOptions').classList.remove('hidden');
      document.getElementById('randomBtn').disabled = room.players.length < 2;
      document.getElementById('startBtn').classList.add('hidden');
    }
  }
});

socket.on('distributed', (room) => {
  document.getElementById('distOptions').classList.add('hidden');
  document.getElementById('teamsView').classList.remove('hidden');
  document.getElementById('teamsView').innerHTML = '<h4>🎲 تم التوزيع:</h4>' + room.teams.map(t => `
    <div class="team-card"><h5>${t.name} (${t.members.length})</h5><p>${t.members.join(' · ')}</p></div>`).join('');
  document.getElementById('startBtn').classList.remove('hidden');
  document.getElementById('startBtn').disabled = false;
});

document.getElementById('randomBtn').onclick = () => socket.emit('distributeRandom');
document.getElementById('startBtn').onclick = () => socket.emit('startRound');

socket.on('roundStartedHost', ({ round, total, data }) => {
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('gameArea').classList.remove('hidden');
  
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('forceEndBtn').classList.remove('hidden'); 
  document.getElementById('revealBox').classList.add('hidden');
  
  const box = document.getElementById('hostAnswerBox');
  box.style.display = 'block'; 
  box.innerHTML = `
    <strong style="color:#fbbf24; font-size:1.1em;">🔒 شاشة المعلم:</strong><br><br>
    <strong>الإجابة الصحيحة:</strong> البطاقة ${data.correct} <br>
    <strong>السبب:</strong> ${data.reasons.find(r => r.correct)?.text} <br>
    <strong>الشرح:</strong> ${data.explain} <br>
    <strong style="color:#4ade80;">(قيمة هذه الجولة: ${data.points} نقاط)</strong>
  `;

  document.getElementById('statusMsg').textContent = `⏳ الجولة ${round} / ${total} — في انتظار اختيارات اللاعبين...`;
  renderCards(data);
});

function renderCards(data) {
  const c = document.getElementById('cardsView');
  c.innerHTML = '';
  ['A','B'].forEach(k => {
    const d = data[k];
    c.innerHTML += `
      <div class="card">
        <div class="card-title">📄 البطاقة ${k}</div>
        <div class="card-field"><span>المنتج</span><b>${d.product}</b></div>
        <div class="card-field"><span>الشدة</span><b class="severity">${d.severity}</b></div>
        <div class="card-field"><span>الحالة</span><b>${d.condition}</b></div>
        <div class="card-field"><span>الأثر</span><b>${d.impact}</b></div>
        <div class="context-box">🏢 ${d.context}</div>
      </div>`;
  });
}

socket.on('progressUpdate', ({ answered, total }) => {
  document.getElementById('statusMsg').textContent = `⏳ ${answered} / ${total} أجابوا...`;
});
socket.on('phaseChange', () => {
  document.getElementById('statusMsg').textContent = '🧠 في انتظار اختيار السبب...';
});

// ✅ عرض النقاط في كشف النتيجة للفردي
socket.on('revealSolo', ({ correct, explain, leaderboard, points }) => {
  document.getElementById('statusMsg').textContent = '';
  document.getElementById('hostAnswerBox').style.display = 'none'; 
  document.getElementById('forceEndBtn').classList.add('hidden'); 
  
  const box = document.getElementById('revealBox');
  box.classList.remove('hidden');
  box.innerHTML = `<h3>✅ الإجابة: ${correct} (الجولة بقيمة ${points} نقاط)</h3><p class="explain">${explain}</p><div class="leaderboard">${leaderboard.map((p, i) => `<div class="lb-row ${i===0?'top':''}"><span class="rank">${i+1}</span><span class="name">${p.name}</span><span class="pts">${p.total}</span></div>`).join('')}</div>`;
  document.getElementById('nextBtn').classList.remove('hidden');
});

// ✅ عرض النقاط في كشف النتيجة للجماعي
socket.on('revealTeam', ({ correct, explain, results, points }) => {
  document.getElementById('statusMsg').textContent = '';
  document.getElementById('hostAnswerBox').style.display = 'none';
  document.getElementById('forceEndBtn').classList.add('hidden');

  const box = document.getElementById('revealBox');
  box.classList.remove('hidden');
  box.innerHTML = `<h3>✅ الإجابة: ${correct} (الجولة بقيمة ${points} نقاط)</h3><p class="explain">${explain}</p><div class="results">${results.map(r => `
    <div class="res-team ${r.pts > (points/2) ? 'perfect' : r.pts > 0 ? 'partial' : 'wrong'}">
      <h4>${r.name}</h4>
      <p>${r.members.join(' · ')}</p>
      <p style="font-size:0.85em; color:#cbd5e1;">البطاقة: ${r.cardRatio}% | السبب: ${r.reasonRatio}%</p>
      <p class="pts">+${r.pts} (المجموع: ${r.total})</p>
    </div>`).join('')}</div>`;
  document.getElementById('nextBtn').classList.remove('hidden');
});

document.getElementById('forceEndBtn').onclick = () => {
  if(confirm('هل أنت متأكد من إنهاء الجولة الآن؟ سيتم احتساب إجابات الطلاب الذين جاوبوا فقط.')) {
    socket.emit('forceEnd');
  }
};

document.getElementById('nextBtn').onclick = () => {
  socket.emit('nextRound');
};

socket.on('readyNext', () => {
  document.getElementById('revealBox').classList.add('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('forceEndBtn').classList.add('hidden');
});

socket.on('gameEnded', () => {
  document.getElementById('gameArea').innerHTML = `<div class="end-screen"><h2>🏁 انتهت اللعبة!</h2><button class="btn" onclick="location.reload()">🔄 لعبة جديدة</button></div>`;
});
</script>
</body>
</html>
