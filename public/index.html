<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صراع النشرات الأمنية</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1 style="text-align: center;">صراع النشرات الأمنية</h1>
    <p class="subtitle" style="text-align: center;">الشدة تصف الضعف... لكن الخطر يعتمد عليك</p>
    <p class="subtitle" style="text-align: center;">20 بطاقة · 10 جولات · فردي أو جماعي</p>
  </header>
  
  <div class="choices">
    <a href="host.html" class="choice-card">
      <!-- أيقونة المشرف (رجل ببدلة) -->
      <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 20px; filter: drop-shadow(0 0 15px #0ea5e9);">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
        <path d="M16 11v2"></path>
        <path d="M8 11v2"></path>
        <path d="M10 16v2"></path>
        <path d="M14 16v2"></path>
      </svg>
      <h2>أنا المشرف</h2>
      <p>أنشئ غرفة واعرض الكود على اللاعبين</p>
    </a>
    
    <a href="player.html" class="choice-card">
      <!-- أيقونة اللاعب (مجموعة أشخاص) -->
      <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 20px; filter: drop-shadow(0 0 15px #8b5cf6);">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <h2>أنا لاعب</h2>
      <p>انضم إلى غرفة بكود من المشرف</p>
    </a>
  </div>

  <!-- الحقوق -->
  <div style="text-align: center; margin-top: 40px; color: #64748b; font-size: 0.9em;">
    <p>تم التصميم والتطوير بواسطة <strong style="color: #94a3b8;">محمد العقيلي HIM.PY</strong> &copy; 2026</p>
  </div>
</div>
</body>
</html>
