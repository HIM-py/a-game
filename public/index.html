<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صراع النشرات الأمنية</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1 style="text-align: center;">صراع النشرات الأمنية</h1>
    <p class="subtitle" style="text-align: center;">الشدة تصف الضعف... لكن الخطر يعتمد عليك</p>
    <p class="subtitle" style="text-align: center;">20 بطاقة · 10 جولات · فردي أو جماعي</p>
  </header>
  
  <div class="choices">
    <a href="host.html" class="choice-card">
      <!-- صورة أفاتار للمشرف (شخص بربطة عنق) -->
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix&backgroundColor=0ea5e9" alt="المشرف" style="width: 110px; height: 110px; border-radius: 50%; margin-bottom: 20px; box-shadow: 0 0 20px rgba(14, 165, 233, 0.6); border: 2px solid #0ea5e9;">
      <h2>أنا المشرف</h2>
      <p>أنشئ غرفة واعرض الكود على اللاعبين</p>
    </a>
    
    <a href="player.html" class="choice-card">
      <!-- صورة أفاتار للاعب (شخصية بهوية مخفية/هاكر) -->
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Jack&backgroundColor=8b5cf6" alt="اللاعب" style="width: 110px; height: 110px; border-radius: 50%; margin-bottom: 20px; box-shadow: 0 0 20px rgba(139, 92, 246, 0.6); border: 2px solid #8b5cf6;">
      <h2>أنا لاعب</h2>
      <p>انضم إلى غرفة بكود من المشرف</p>
    </a>
  </div>

  <!-- الحقوق -->
  <div style="text-align: center; margin-top: 40px; color: #64748b; font-size: 0.9em;">
    <p>تم التصميم والتطوير بواسطة <strong style="color: #94a3b8;">محمد العقيلي HIM.PY</strong> &copy; 2026</p>
  </div>
</div>
</body>
</html>
