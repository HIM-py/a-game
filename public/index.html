<!DOCTYPE html>
<html lang="ar" dir="rtl">

<title>صراع النشرات الأمنية</title>

<body>
<div class="container">
  <header>
    <h1 style="text-align: center;">صراع النشرات الأمنية</h1>
    <p class="subtitle" style="text-align: center;">الشدة تصف الضعف... لكن الخطر يعتمد عليك</p>
    <p class="subtitle" style="text-align: center;">20 بطاقة · 10 جولات · فردي أو جماعي</p>
  </header>
  
  <div class="choices">
    <a href="host.html" class="choice-card">
      <!-- صورة المشرف: host.png -->
      <img src="/img/host.png" alt="المشرف" style="width: 130px; height: 130px; object-fit: cover; border-radius: 50%; border: 3px solid #0ea5e9; box-shadow: 0 0 25px rgba(14, 165, 233, 0.7); margin-bottom: 20px; background-color: #060b19;">

      <img src="/img/player.png" alt="اللاعب" style="width: 130px; height: 130px; object-fit: cover; border-radius: 50%; border: 3px solid #8b5cf6; box-shadow: 0 0 25px rgba(139, 92, 246, 0.7); margin-bottom: 20px; background-color: #060b19;">
