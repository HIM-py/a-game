<!DOCTYPE html>
<html lang="ar" dir="rtl">

<div class="container">
  <header>
    <h1 style="text-align: center;">صراع النشرات الأمنية</h1>

  </header>
  
  <div class="choices">
    <a href="host.html" class="choice-card">
      <!-- صورة درع سيبراني للمشرف -->

    <a href="player.html" class="choice-card">

      <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=200&auto=format&fit=crop" alt="اللاعب" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; border: 3px solid #8b5cf6; box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);">

      <p>انضم إلى غرفة بكود من المشرف</p>

  <!-- الحقوق -->

    <p>تم التصميم والتطوير بواسطة <strong style="color: #94a3b8;">محمد العقيلي HIM.PY</strong> &copy; 2026</p>
